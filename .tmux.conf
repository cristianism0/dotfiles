# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Windows
bind c new-window
bind n next-window
bind p previous-window
bind x kill-pane

# Splits
bind | split-window -h
bind - split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane zoom
bind z resize-pane -Z

# Window rename
bind , command-prompt "rename-window '%%'"

# Session rename
bind . command-prompt "rename-session '%%'"

# Mouse 
set -g mouse on

# Theme - Rose Pine
set -g status on
set -g status-position top 
set -g status-justify left
set -g default-terminal "alacritty"

# Set all colors to default
set -g status-style bg=default,fg=default
set -g status-left-style bg=default,fg=default
set -g status-right-style bg=default,fg=default
setw -g window-status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default

setw -g window-status-separator " "

set -g status-left ""

set -g status-right "#[fg=colour238,bg=default]#[fg=white,bg=colour238] %D  %H:%M #[fg=colour238,bg=default]"

setw -g window-status-current-format "#[fg=cyan,bg=default]#[fg=black,bg=cyan] #I  #W  #S #[fg=cyan,bg=default]"

setw -g window-status-format "#[fg=colour236,bg=default]#[fg=white,bg=colour236] #I  #W #[fg=colour236,bg=default]"
